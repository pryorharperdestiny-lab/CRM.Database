name: Generate Mock CRM Data

on:
  push:
    paths:
      - 'scripts/generate_data.py'
  workflow_dispatch:               # Allows you to click a manual button to regenerate data

jobs:
  generate-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy

    - name: Run Data Generator
      run: python scripts/generate_data.py
      
# Run the analysis script to print the summary reports
    - name: Run CRM Analysis Script
      run: python scripts/crm_analysis.py

# Automatically commit and push the newly generated versioned CSV back to the repo
    - name: Commit Generated CSV
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add data/v*mock_crm_database.csv
        git commit -m "Auto-generated fresh CRM dataset version via GitHub Actions" || echo "No changes to commit"
        git push
