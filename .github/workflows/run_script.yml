name: Run Practice Query Script

on:
  push:
    branches: [ main ]  # Runs automatically whenever you push code to main
  workflow_dispatch:     # Adds a manual "Run workflow" button in the GitHub UI

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out your repository code so the runner can see your CSV and script
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Python on the virtual machine
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    # 3. Install necessary libraries (like pandas)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas

    # 4. Execute your Python script
    - name: Run Query Script
      run: python crm_analysis.py
